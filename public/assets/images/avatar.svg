<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- 背景渐变：从深蓝到青蓝，如清晨天空 -->
    <radialGradient id="bgGrad" cx="38%" cy="35%" r="70%">
      <stop offset="0%"   stop-color="#1a3a5c"/>
      <stop offset="55%"  stop-color="#0e2240"/>
      <stop offset="100%" stop-color="#060f22"/>
    </radialGradient>

    <!-- 主光源：中心柔光 -->
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="50%">
      <stop offset="0%"   stop-color="#7ecfff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7ecfff" stop-opacity="0"/>
    </radialGradient>

    <!-- 风文字渐变 -->
    <linearGradient id="charGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#e0f4ff"/>
      <stop offset="50%"  stop-color="#a8ddff"/>
      <stop offset="100%" stop-color="#5cb8e8"/>
    </linearGradient>

    <!-- 风纹渐变 -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7ecfff" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#7ecfff" stop-opacity="0.7"/>
      <stop offset="70%"  stop-color="#b0e8ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b0e8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a0d8ff" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#a0d8ff" stop-opacity="0.5"/>
      <stop offset="80%"  stop-color="#d0f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d0f0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c0eaff" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#c0eaff" stop-opacity="0.4"/>
      <stop offset="65%"  stop-color="#88ccee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#88ccee" stop-opacity="0"/>
    </linearGradient>

    <!-- 花瓣渐变 -->
    <radialGradient id="petalGrad1" cx="40%" cy="30%" r="60%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a8d8f0" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="petalGrad2" cx="40%" cy="30%" r="60%">
      <stop offset="0%"   stop-color="#e8f8ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7ab8d8" stop-opacity="0.5"/>
    </radialGradient>

    <!-- 滤镜 -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur3">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur1p5">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <clipPath id="mainCircle">
      <circle cx="200" cy="200" r="194"/>
    </clipPath>
  </defs>

  <!-- 底层背景 -->
  <circle cx="200" cy="200" r="200" fill="#060f22"/>
  <circle cx="200" cy="200" r="194" fill="url(#bgGrad)" clip-path="url(#mainCircle)"/>
  <circle cx="200" cy="200" r="194" fill="url(#centerGlow)" clip-path="url(#mainCircle)"/>

  <!-- 星点 -->
  <g clip-path="url(#mainCircle)" opacity="0.65">
    <circle cx="48"  cy="52"  r="1.1" fill="#cce8ff"/>
    <circle cx="110" cy="38"  r="0.8" fill="#ddf2ff"/>
    <circle cx="175" cy="28"  r="1.3" fill="#cce8ff"/>
    <circle cx="290" cy="45"  r="0.9" fill="#ddf2ff"/>
    <circle cx="355" cy="72"  r="1.2" fill="#cce8ff"/>
    <circle cx="370" cy="140" r="0.8" fill="#ddf2ff"/>
    <circle cx="58"  cy="155" r="1.0" fill="#cce8ff"/>
    <circle cx="32"  cy="280" r="0.9" fill="#ddf2ff"/>
    <circle cx="360" cy="310" r="1.1" fill="#cce8ff"/>
    <circle cx="80"  cy="350" r="0.8" fill="#ddf2ff"/>
    <circle cx="320" cy="370" r="1.0" fill="#cce8ff"/>
    <circle cx="140" cy="360" r="0.7" fill="#ddf2ff"/>
    <circle cx="240" cy="55"  r="1.0" fill="#cce8ff"/>
  </g>

  <!-- ===== 风纹流线 ===== -->
  <g clip-path="url(#mainCircle)">
    <path d="M20 155 Q110 120 200 145 Q290 170 370 140"
          stroke="url(#streamGrad1)" stroke-width="2"   fill="none" opacity="0.8"/>
    <path d="M10 172 Q120 135 205 162 Q295 188 378 155"
          stroke="url(#streamGrad2)" stroke-width="1.5" fill="none" opacity="0.65"/>
    <path d="M25 190 Q115 158 202 180 Q300 205 382 178"
          stroke="url(#streamGrad3)" stroke-width="1.2" fill="none" opacity="0.5"/>

    <path d="M15 220 Q90 198 180 215 Q260 230 370 210"
          stroke="url(#streamGrad1)" stroke-width="1.8" fill="none" opacity="0.6"/>
    <path d="M18 238 Q100 215 192 232 Q275 250 375 228"
          stroke="url(#streamGrad2)" stroke-width="1.3" fill="none" opacity="0.45"/>

    <path d="M30 270 Q120 255 200 265 Q285 275 368 258"
          stroke="url(#streamGrad3)" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M22 288 Q112 272 200 282 Q292 292 375 275"
          stroke="url(#streamGrad1)" stroke-width="1.0" fill="none" opacity="0.3"/>

    <path d="M40 120 Q140 95 220 115 Q300 135 368 112"
          stroke="url(#streamGrad2)" stroke-width="1.2" fill="none" opacity="0.45"/>
    <path d="M55 104 Q148 80 225 100 Q308 118 370 96"
          stroke="url(#streamGrad3)" stroke-width="0.9" fill="none" opacity="0.3"/>
  </g>

  <!-- ===== 飘散花瓣 ===== -->
  <g clip-path="url(#mainCircle)">
    <g transform="translate(88,118) rotate(-35)">
      <ellipse rx="12" ry="20" fill="url(#petalGrad1)" opacity="0.82"/>
    </g>
    <g transform="translate(68,148) rotate(20)">
      <ellipse rx="8"  ry="14" fill="url(#petalGrad2)" opacity="0.65"/>
    </g>
    <g transform="translate(318,108) rotate(50)">
      <ellipse rx="10" ry="17" fill="url(#petalGrad1)" opacity="0.72"/>
    </g>
    <g transform="translate(338,138) rotate(-20)">
      <ellipse rx="7"  ry="12" fill="url(#petalGrad2)" opacity="0.58"/>
    </g>
    <g transform="translate(52,205) rotate(10)">
      <ellipse rx="9"  ry="15" fill="url(#petalGrad1)" opacity="0.55"/>
    </g>
    <g transform="translate(348,215) rotate(-40)">
      <ellipse rx="8"  ry="13" fill="url(#petalGrad2)" opacity="0.6"/>
    </g>
    <g transform="translate(152,85) rotate(30)">
      <ellipse rx="6"  ry="10" fill="url(#petalGrad1)" opacity="0.5"/>
    </g>
    <g transform="translate(262,90) rotate(-15)">
      <ellipse rx="7"  ry="11" fill="url(#petalGrad2)" opacity="0.5"/>
    </g>
    <g transform="translate(120,315) rotate(25)">
      <ellipse rx="8"  ry="13" fill="url(#petalGrad1)" opacity="0.42"/>
    </g>
    <g transform="translate(285,308) rotate(-30)">
      <ellipse rx="7"  ry="11" fill="url(#petalGrad2)" opacity="0.4"/>
    </g>
    <!-- 光点 -->
    <circle cx="108" cy="172" r="2.5" fill="#c8e8ff" opacity="0.55" filter="url(#blur1p5)"/>
    <circle cx="295" cy="165" r="2"   fill="#d8f0ff" opacity="0.50" filter="url(#blur1p5)"/>
    <circle cx="75"  cy="248" r="2"   fill="#b8e0ff" opacity="0.45" filter="url(#blur1p5)"/>
    <circle cx="330" cy="255" r="2.5" fill="#c8e8ff" opacity="0.45" filter="url(#blur1p5)"/>
    <circle cx="165" cy="310" r="1.8" fill="#d0eeff" opacity="0.40" filter="url(#blur1p5)"/>
    <circle cx="240" cy="318" r="2"   fill="#b8e0ff" opacity="0.40" filter="url(#blur1p5)"/>
  </g>

  <!-- ===== 「若风」文字 ===== -->
  <g clip-path="url(#mainCircle)">
    <!-- 发光底层 -->
    <text x="200" y="228" text-anchor="middle"
          font-family="'Noto Serif SC','Source Han Serif CN','SimSun',serif"
          font-size="108" font-weight="700"
          fill="#7ecfff" opacity="0.25" filter="url(#blur3)">若风</text>
    <!-- 主文字 -->
    <text x="200" y="228" text-anchor="middle"
          font-family="'Noto Serif SC','Source Han Serif CN','SimSun',serif"
          font-size="108" font-weight="700"
          fill="url(#charGrad)" opacity="0.95" filter="url(#softGlow)">若风</text>
  </g>

  <!-- ===== 装饰圆圈 ===== -->
  <g clip-path="url(#mainCircle)">
    <circle cx="200" cy="200" r="178" fill="none" stroke="#4a90c0" stroke-width="0.8" opacity="0.22"/>
    <circle cx="200" cy="200" r="170" fill="none" stroke="#7ecfff" stroke-width="0.5" opacity="0.15"
            stroke-dasharray="4 8"/>
  </g>

  <!-- 外边框 -->
  <circle cx="200" cy="200" r="194" fill="none" stroke="#3a78a8" stroke-width="1.5" opacity="0.5"/>
  <circle cx="200" cy="200" r="197" fill="none" stroke="#1a4a6a" stroke-width="1"   opacity="0.3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f5f0ea"/>
      <stop offset="100%" stop-color="#ede5da"/>
    </linearGradient>

    <!-- 装饰色块渐变 -->
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e0d2c0"/>
      <stop offset="100%" stop-color="#d8c8b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ddd0bc"/>
      <stop offset="100%" stop-color="#d0c0a8" stop-opacity="0"/>
    </radialGradient>

    <!-- Python 蓝色渐变 -->
    <linearGradient id="pyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4b8bbe"/>
      <stop offset="100%" stop-color="#306998"/>
    </linearGradient>
    <!-- Python 黄色渐变 -->
    <linearGradient id="pyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffe873"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>

    <!-- OpenCV 绿色渐变 -->
    <linearGradient id="cvGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#b8a898" flood-opacity="0.25"/>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#8a7060" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bgGrad)" rx="0"/>

  <!-- 装饰色块：左上角 -->
  <ellipse cx="-40" cy="-20" rx="340" ry="300" fill="url(#blob1)" opacity="0.75"/>
  <ellipse cx="80"  cy="60"  rx="220" ry="180" fill="#ddd0bc" opacity="0.35"/>

  <!-- 装饰色块：右下角 -->
  <ellipse cx="1240" cy="650" rx="360" ry="320" fill="url(#blob2)" opacity="0.75"/>
  <ellipse cx="1120" cy="580" rx="200" ry="170" fill="#d8c8b2" opacity="0.35"/>

  <!-- 装饰色块：右上角小 -->
  <ellipse cx="1180" cy="30"  rx="160" ry="140" fill="#e2d4c2" opacity="0.45"/>

  <!-- 装饰色块：左下角小 -->
  <ellipse cx="20"   cy="610" rx="150" ry="130" fill="#e0d2c0" opacity="0.4"/>

  <!-- ===== 图标区域（Python + OpenCV 组合图标）===== -->
  <g transform="translate(600, 185)" filter="url(#iconShadow)">

    <!-- Python Logo（官方标准路径）-->
    <g transform="translate(-86, -42) scale(0.72)">
      <!-- 蓝色蛇 -->
      <path fill="url(#pyBlue)"
            d="M 63.391,1.547
               C 51.311,1.547 42.938,5.051 38.344,11.375
               C 33.761,17.688 33.984,25.567 33.984,32.484
               L 33.984,48.391 L 55.016,48.391 L 55.016,55.016 L 20.297,55.016
               C 12.234,55.016 5.051,59.699 2.797,68.578
               C 0.219,78.739 0.109,85.132 2.797,95.734
               C 4.789,103.723 9.422,109.234 17.484,109.234
               L 27.375,109.234 L 27.375,90.734
               C 27.375,81.664 34.636,73.812 44.219,73.812
               L 68.578,73.812
               C 76.323,73.812 82.422,67.59 82.422,59.844
               L 82.422,27.234
               C 82.422,19.762 76.14,14.219 68.578,12.734
               C 63.391,11.703 63.391,1.547 63.391,1.547 Z"/>
      <circle fill="#9dc6db" cx="53.531" cy="20.641" r="6.25"/>

      <!-- 黄色蛇 -->
      <path fill="url(#pyYellow)"
            d="M 36.609,110.453
               C 48.689,110.453 57.062,106.949 61.656,100.625
               C 66.239,94.312 66.016,86.433 66.016,79.516
               L 66.016,63.609 L 44.984,63.609 L 44.984,57.016 L 79.703,57.016
               C 87.766,57.016 94.949,52.301 97.203,43.422
               C 99.781,33.261 99.891,26.868 97.203,16.266
               C 95.211,8.277 90.578,2.766 82.516,2.766
               L 72.625,2.766 L 72.625,21.266
               C 72.625,30.336 65.364,38.188 55.781,38.188
               L 31.422,38.188
               C 23.677,38.188 17.578,44.41 17.578,52.156
               L 17.578,84.766
               C 17.578,92.238 23.86,97.781 31.422,99.266
               C 36.609,100.297 36.609,110.453 36.609,110.453 Z"/>
      <circle fill="#ffe873" cx="46.469" cy="91.359" r="6.25"/>
    </g>

    <!-- + 号 -->
    <text x="72" y="8" font-family="Arial,sans-serif" font-size="38" font-weight="300"
          fill="#a09080" text-anchor="middle">+</text>

    <!-- OpenCV 简化图标：三个彩色圆（BGR）-->
    <g transform="translate(108, -44)">
      <!-- 外圆背景 -->
      <circle cx="40" cy="40" r="42" fill="white" opacity="0.6"/>
      <!-- 蓝圆 -->
      <circle cx="24" cy="50" r="22" fill="#1565c0" opacity="0.88"/>
      <!-- 绿圆 -->
      <circle cx="56" cy="50" r="22" fill="#2e7d32" opacity="0.88"/>
      <!-- 红圆 -->
      <circle cx="40" cy="24" r="22" fill="#c62828" opacity="0.88"/>
      <!-- 中心高亮 -->
      <circle cx="40" cy="40" r="9" fill="white" opacity="0.75"/>
    </g>
  </g>

  <!-- ===== 主标题 ===== -->
  <text x="600" y="318"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="64" font-weight="700"
        fill="#2c1f14"
        text-anchor="middle"
        letter-spacing="2">Python + OpenCV</text>

  <text x="600" y="392"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="54" font-weight="700"
        fill="#3a2a1a"
        text-anchor="middle"
        letter-spacing="4">图像处理实战</text>


  <!-- 细节：底部装饰线 -->
  <line x1="480" y1="540" x2="720" y2="540" stroke="#c8b8a0" stroke-width="1" opacity="0.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="windGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6ec6f5"/>
      <stop offset="100%" stop-color="#4a9fd4"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7de8a0"/>
      <stop offset="100%" stop-color="#3ab86a"/>
    </linearGradient>
  </defs>

  <!-- 风纹三道弧线 -->
  <path d="M10 22 Q28 14 46 20 Q54 23 58 20"
        stroke="url(#windGrad)" stroke-width="3.2" fill="none"
        stroke-linecap="round" opacity="0.95"/>
  <path d="M6 32 Q26 22 48 30 Q56 33 60 30"
        stroke="url(#windGrad)" stroke-width="3.2" fill="none"
        stroke-linecap="round" opacity="0.75"/>
  <path d="M10 42 Q28 34 46 40 Q54 43 58 40"
        stroke="url(#windGrad)" stroke-width="3.2" fill="none"
        stroke-linecap="round" opacity="0.5"/>

  <!-- 小叶片（若风意象） -->
  <ellipse cx="14" cy="32" rx="6" ry="3.5"
           fill="url(#leafGrad)" opacity="0.9"
           transform="rotate(-20 14 32)"/>
  <ellipse cx="14" cy="32" rx="4" ry="2"
           fill="none" stroke="#fff" stroke-width="0.6" opacity="0.5"
           transform="rotate(-20 14 32)"/>
</svg>
